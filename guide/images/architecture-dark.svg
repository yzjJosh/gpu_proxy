<text x="714" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">llm.lan → :8001</text>
<text x="912" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#9198a1" text-anchor="end">16 GB</text>
