<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Diagram: your apps send requests to gpu-proxy on port 8080, which routes them by hostname to three model containers on one 24 GB GPU. To make room for the LLM, the proxy evicted idle ComfyUI and kept busy Whisper running.">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656c76"/></marker></defs>
<rect x="20" y="160" width="190" height="120" rx="12" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="115" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f0f6fc" text-anchor="middle">Your apps</text>
<text x="115" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">any HTTP client</text>
<text x="115" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">chat UIs, agents, scripts</text>
<path d="M212,220 L300,220" stroke="#656c76" stroke-width="1.6" marker-end="url(#head)"/>
<text x="256" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#9198a1" text-anchor="middle">Host: *.lan</text>
<rect x="306" y="140" width="180" height="160" rx="12" fill="#0c2d6b" stroke="#1f6feb" stroke-width="1.5"/>
<text x="396" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#79c0ff" text-anchor="middle">gpu-proxy</text>
<text x="396" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#79c0ff" text-anchor="middle">:8080</text>
<line x1="330" y1="226" x2="462" y2="226" stroke="#1f6feb" stroke-opacity="0.5"/>
<text x="396" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="middle">routes by hostname</text>
<text x="396" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="middle">frees VRAM on demand</text>
<rect x="586" y="16" width="362" height="408" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="610" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1"><tspan font-size="15" font-weight="700" fill="#f0f6fc">GPU 0</tspan>  ·  24 GB VRAM  ·  Docker containers</text>
<path d="M486,220 C555.0,220 535.0,101 604,101" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#head)"/>
<path d="M486,220 C555.0,220 535.0,191 604,191" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#head)" stroke-dasharray="6 4"/>
<path d="M486,220 C555.0,220 535.0,281 604,281" fill="none" stroke="#656c76" stroke-width="1.6" marker-end="url(#head)"/>
