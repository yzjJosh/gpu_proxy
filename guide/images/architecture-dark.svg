<rect x="630" y="286" width="86" height="20" rx="10" fill="#2a323c"/><text x="673.0" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9198a1" text-anchor="middle">priority 3</text>
