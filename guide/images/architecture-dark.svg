<rect x="724.0" y="196" width="188" height="20" rx="10" fill="#212830" stroke="#9198a1" stroke-dasharray="3 2"/><text x="818.0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9198a1" text-anchor="middle">evicted (was idle, 12 GB)</text>
